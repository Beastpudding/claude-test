# JupyterHub Helm chart values for AWS EKS
# Chart: zero-to-jupyterhub 4.x (https://hub.jupyter.org/helm-chart/)
# Install: helm upgrade --install jupyterhub /tmp/jupyterhub-4.3.4.tgz --values helm/values.yaml
#
# Required overrides at deploy time (see deploy.sh):
#   hub.image.name, singleuser.image.name, proxy.secretToken,
#   hub.config.Authenticator.admin_users

# ============================================================
# Hub
# ============================================================
hub:
  # Custom image that adds NativeAuthenticator on top of k8s-hub.
  # Built from Dockerfile.jupyterhub and pushed to ECR by deploy.sh.
  image:
    name: ""          # set by deploy.sh: <ECR>/jupyterhub-hub
    tag: latest
    pullPolicy: Always

  config:
    JupyterHub:
      authenticator_class: nativeauthenticator.NativeAuthenticator
    NativeAuthenticator:
      open_signup: true
    Authenticator:
      allow_all: true
      # admin_users set via --set at deploy time

  extraConfig:
    00-spawner: |
      c.Spawner.default_url = "/launcher"
      c.Spawner.start_timeout = 300
      c.Spawner.http_timeout = 180
      c.KubeSpawner.container_security_context = {
          "privileged": True,
          "allowPrivilegeEscalation": True,
          "runAsUser": 1000,
      }

  db:
    pvc:
      storageClassName: gp2
      accessModes:
        - ReadWriteOnce
      storage: 2Gi

# ============================================================
# Proxy
# ============================================================
proxy:
  # Generated by deploy.sh: openssl rand -hex 32
  secretToken: ""
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

# ============================================================
# Single-user server (per-user pod)
# ============================================================
singleuser:
  # Built from Dockerfile.codeserver and pushed to ECR by deploy.sh.
  image:
    name: ""          # set by deploy.sh: <ECR>/codeserver-kbdev
    tag: latest
    pullPolicy: Always

  defaultUrl: "/launcher"

  storage:
    type: dynamic
    dynamic:
      storageClass: gp2
    capacity: 10Gi
    homeMountPath: /home/jovyan/work

  extraEnv:
    CODE_EXTENSIONSDIR: /opt/code-server-extensions
    GRANT_SUDO: "yes"
    RESTARTABLE: "yes"

  uid: 1000
  fsGid: 100

  cpu:
    limit: 1
    guarantee: 0.1
  memory:
    limit: 1G
    guarantee: 256M

  profileList:
    - display_name: "Python 3.12 + VS Code (Code-Server)"
      description: "JupyterLab + Code-Server + Docker-in-Docker"
      default: true

# ============================================================
# Ingress (AWS ALB Ingress Controller)
# Enable after installing aws-load-balancer-controller on the cluster.
# ============================================================
ingress:
  enabled: false      # flip to true once ALB controller is installed
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
  hosts:
    - ""              # e.g. jupyterhub.example.com
  tls: []

# ============================================================
# Scheduling / resource management
# ============================================================
scheduling:
  userScheduler:
    enabled: false
  podPriority:
    enabled: false
  userPlaceholder:
    enabled: false

# ============================================================
# Pre-puller — disabled to keep node startup fast.
# ============================================================
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
