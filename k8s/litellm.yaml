# LiteLLM proxy: receives Claude API requests from code-server pods
# and forwards them to AWS Bedrock using IRSA credentials.
# deploy.sh replaces __LITELLM_ROLE_ARN__ before applying.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: jupyterhub
  annotations:
    eks.amazonaws.com/role-arn: "__LITELLM_ROLE_ARN__"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: jupyterhub
data:
  config.yaml: |
    model_list:
      # Alias 이름은 Claude Code가 실제로 보내는 model 문자열에 맞춰서 그대로 유지.
      # 백엔드(bedrock/*)만 실제 사용 가능한 inference profile로 매핑.

      # ── Sonnet 4.6 (Claude Code 기본 모델) ──────────────────────────
      - model_name: claude-sonnet-4-6
        litellm_params:
          model: bedrock/global.anthropic.claude-sonnet-4-6
          aws_region_name: ap-northeast-2

      # ── Opus 4.7 ──────────────────────────────────────────────────
      - model_name: claude-opus-4-7
        litellm_params:
          model: bedrock/global.anthropic.claude-opus-4-7
          aws_region_name: ap-northeast-2

      # ── Opus 4.8 (신규 모델) ─────────────────────────────────────
      - model_name: claude-opus-4-8
        litellm_params:
          model: bedrock/global.anthropic.claude-opus-4-8
          aws_region_name: ap-northeast-2

      # ── Haiku 4.5 ────────────────────────────────────────────────
      - model_name: claude-haiku-4-5-20251001
        litellm_params:
          model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
          aws_region_name: ap-northeast-2

    litellm_settings:
      drop_params: true                # Bedrock이 지원하지 않는 파라미터 자동 제거
      # Claude Code v2.1.131은 LiteLLM의 기본 drop_params 목록에 없는 신규
      # 파라미터들을 보내 Bedrock에서 400을 받습니다. 안전망으로 강제 제거.
      additional_drop_params:
        - thinking
        - context_management
      set_verbose: false

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      # Persist request/response messages to LiteLLM_SpendLogs (Postgres) so
      # the Admin UI's "Logs" page shows full chat content per request.
      store_prompts_in_spend_logs: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: jupyterhub
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: litellm
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: NotIn
                    values:
                      - ap-northeast-2d
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args:
            - --config=/etc/litellm/config.yaml
            - --port=4000
            # `prisma db push` (not migrate deploy) — avoids downloading the
            # debian migration engine binary at runtime on the wolfi image.
            - --use_prisma_db_push
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: database-url
            - name: AWS_DEFAULT_REGION
              value: "ap-northeast-2"
            - name: WORKERS_COUNT
              value: "1"
            # Logs full request `proxy_server_request` and `response` JSON into
            # LiteLLM_SpendLogs (Postgres). Visible in Admin UI → Logs.
            # Env-var path is checked unconditionally by litellm (cf. config flag).
            - name: STORE_PROMPTS_IN_SPEND_LOGS
              value: "true"
          ports:
            - containerPort: 4000
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              # 2Gi: Prisma binary init can OOMKill at lower limits (we saw 1200Mi fail).
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: litellm-config

---
# In-cluster Service (used by JupyterHub pre_spawn_hook and singleuser pods)
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: jupyterhub
  labels:
    app: litellm
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  type: ClusterIP

---
# Public NLB for the LiteLLM Admin UI (CloudFront origin, WAF-protected).
# TLS terminates at CloudFront; this NLB serves plain HTTP.
apiVersion: v1
kind: Service
metadata:
  name: litellm-public
  namespace: jupyterhub
  labels:
    app: litellm
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: litellm
  ports:
    - port: 80
      targetPort: 4000
      name: http
  type: LoadBalancer
