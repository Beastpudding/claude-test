# Karpenter NodePool + EC2NodeClass for JupyterHub singleuser scaling.
# Applied by deploy.sh after `helm install karpenter`.
#
# Prerequisites (one-time setup on the EKS cluster — see CLAUDE.md "Karpenter bootstrap"):
#   - EKS OIDC provider registered
#   - IAM roles: KarpenterController-${CLUSTER_NAME}, KarpenterNodeRole-${CLUSTER_NAME}
#   - SQS queue + EventBridge rules (interruption handling)
#   - Private subnets tagged: karpenter.sh/discovery: ${CLUSTER_NAME}
#   - Cluster SG tagged:     karpenter.sh/discovery: ${CLUSTER_NAME}
#   - `helm install karpenter` from public.ecr.aws/karpenter/karpenter
#
# deploy.sh substitutes __CLUSTER_NAME__ before applying.
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  # eksctl이 생성한 실제 역할명(eksctl- 접두사). 접두사 없으면 NoSuchEntity로 NodeClass가 NotReady가 됨.
  role: "eksctl-KarpenterNodeRole-__CLUSTER_NAME__"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "__CLUSTER_NAME__"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "__CLUSTER_NAME__"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    # IMDSv2 hop limit 2 — required for pods (e.g. EBS CSI) to reach IMDS
    # (default is 1; pods are 2 hops away).
    httpPutResponseHopLimit: 2
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpTokens: required
  tags:
    Name: "karpenter/__CLUSTER_NAME__/default"
    karpenter.sh/discovery: "__CLUSTER_NAME__"

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        node-pool: default
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Spot으로 비용 절감, 부족하면 on-demand fallback.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # non-burstable(m 계열)만 허용. t3/t3a는 burstable이라 CPU 크레딧 소진 시
        # 노드 전체가 throttle → kubelet heartbeat 끊김(NodeNotReady) 유발하므로 제외.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m5", "m5a", "m6i", "m6a"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]
        # 2d AZ는 t3.medium 부족 이슈가 있어서 회피한 패턴 유지.
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # 노드 최대 수명 — 보안 패치 자동 적용 효과.
      expireAfter: 720h

  disruption:
    # 빈 노드만 정리 — 살아있는 사용자 pod 강제 evict 금지.
    # (Underutilized 모드는 사용자 작업 중 pod을 다른 노드로 옮겨 EBS race 유발)
    consolidationPolicy: WhenEmpty
    # 빈 상태 5분 지속 후 종료. spike 시 즉시 축소 대신 살짝 여유.
    consolidateAfter: 5m

  # 전체 클러스터 수준 상한 — 폭주 시 비용 안전망.
  limits:
    cpu: "100"
    memory: 400Gi

---
# JupyterHub 전용 NodePool — 테넌트 격리.
# 노드에 hub.jupyter.org/dedicated=user:NoSchedule 태인트를 부여한다.
#   - singleuser pod는 z2jh가 이 태인트 toleration을 기본 부여 → 스케줄 가능
#   - hub pod도 values.yaml hub.tolerations로 동일 태인트 tolerate
#   - aidc 등 다른 namespace pod는 이 태인트를 못 견뎌 절대 못 올라옴
# 반대로 hub/singleuser는 values.yaml nodeSelector(node-pool=jupyterhub)로 이 풀에만 배치.
# → aidc 오버커밋이 JupyterHub 노드를 죽이는 교차 오염 구조적 차단.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: jupyterhub
spec:
  template:
    metadata:
      labels:
        node-pool: jupyterhub
    spec:
      taints:
        - key: hub.jupyter.org/dedicated
          value: user
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # 사용자 세션 안정성 우선 — Spot 회수로 안 끊기도록 on-demand 전용.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # non-burstable(m 계열)만. burstable(t 계열) CPU 크레딧 소진 회피.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m5", "m5a", "m6i", "m6a"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h

  disruption:
    # 사용자 작업 중 pod 강제 이동 금지 — 빈 노드만 정리.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m

  limits:
    cpu: "60"
    memory: 240Gi

---
# 공용 sandbox NodePool — singleuser 사용자들이 자기 namespace(sbx-<user>)에서
# 배포테스트하는 pod가 올라가는 공유 풀. taint 로 jupyterhub/aidc/default 와 격리:
#   - 사용자 배포 매니페스트는 nodeSelector(node-pool=sandbox) + 이 taint toleration 을 넣어야 스케줄됨
#     (toleration 없으면 Pending → 실수로 다른 노드 오염되는 것 방지, fail-closed)
# 유휴 시 노드 0 으로 축소(비용). spot 우선 + on-demand fallback.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandbox
spec:
  template:
    metadata:
      labels:
        node-pool: sandbox
    spec:
      taints:
        - key: sandbox
          value: "user"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m5", "m5a", "m6i", "m6a", "t3", "t3a"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m

  # 전체 sandbox 풀 상한 (폭주/비용 안전망)
  limits:
    cpu: "48"
    memory: 192Gi
