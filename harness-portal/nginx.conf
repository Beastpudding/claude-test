# Serves the built SPA under the JupyterHub service prefix.
# chp forwards the full path (/services/harness-portal/...) to this pod, so the
# app is served under that exact location (assets were built with that base).
server {
    listen 8000;
    server_name _;

    # Health probe
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirect the bare prefix to the trailing-slash form
    location = /services/harness-portal {
        return 301 /services/harness-portal/;
    }

    # SPA under the service prefix; fall back to index.html for client routes.
    location /services/harness-portal/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /services/harness-portal/index.html;
    }
}
