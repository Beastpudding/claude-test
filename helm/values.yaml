# JupyterHub Helm chart values for AWS EKS
# Chart: zero-to-jupyterhub 4.x (https://hub.jupyter.org/helm-chart/)
#
# Required overrides at deploy time (see deploy.sh):
#   hub.image.name, singleuser.image.name, proxy.secretToken,
#   hub.config.Authenticator.admin_users, JUPYTERHUB_PUBLIC_URL

# ============================================================
# Hub
# ============================================================
hub:
  annotations:
    karpenter.sh/do-not-disrupt: "true"

  # hub DB는 ReadWriteOnce EBS 볼륨이라 노드가 죽으면 Multi-Attach로 재기동이 수십 분 지연됨.
  # on-demand 노드에만 배치 → Spot 회수 방지 + bootstrap t3.medium(라벨 없음) 자동 회피
  # (3.2Gi 소형 노드 오버커밋 사망에 hub가 휘말리지 않도록).
  nodeSelector:
    karpenter.sh/capacity-type: on-demand

  image:
    name: ""          # set by deploy.sh: <ECR>/jupyterhub-hub
    tag: latest
    pullPolicy: Always

  config:
    # authenticator_class is set dynamically in extraConfig (01-auth).
    # Falls back to NativeAuthenticator when Cognito creds are unset.
    NativeAuthenticator:
      open_signup: true
    Authenticator:
      allow_all: true
      # admin_users set via --set at deploy time

  extraEnv:
    # Cognito OIDC credentials — read from jupyterhub-cognito secret.
    # optional: true → hub starts normally even if secret doesn't exist yet (falls
    # back to NativeAuthenticator).
    COGNITO_DOMAIN:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-cognito
          key: domain
          optional: true
    COGNITO_CLIENT_ID:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-cognito
          key: client-id
          optional: true
    COGNITO_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-cognito
          key: client-secret
          optional: true
    # LiteLLM master key — used by pre_spawn_hook to create per-user virtual keys.
    LITELLM_MASTER_KEY:
      valueFrom:
        secretKeyRef:
          name: litellm-secrets
          key: master-key

  # Custom Jinja2 templates (page/spawn/login) live in the `hub-templates`
  # ConfigMap, created by deploy.sh from k8s/templates/*.html. They override
  # the default templates to apply "Virtual AI 센터" branding and Korean labels.
  # Mounted below in extraVolumeMounts → /etc/jupyterhub/custom-templates,
  # and registered via 99-templates extraConfig below.

  extraConfig:
    00-spawner: |
      c.Spawner.default_url = "/launcher"
      c.Spawner.start_timeout = 300
      c.Spawner.http_timeout = 180
      c.KubeSpawner.container_security_context = {
          "privileged": True,
          "allowPrivilegeEscalation": True,
          "runAsUser": 1000,
      }

    01-auth: |
      import os

      cognito_domain    = os.environ.get("COGNITO_DOMAIN", "").rstrip("/")
      cognito_client_id = os.environ.get("COGNITO_CLIENT_ID", "")

      if cognito_domain and cognito_client_id:
          # ── Cognito User Pool OAuth/OIDC 로그인 ─────────────────────────
          from oauthenticator.generic import GenericOAuthenticator
          c.JupyterHub.authenticator_class = GenericOAuthenticator
          c.GenericOAuthenticator.client_id     = cognito_client_id
          c.GenericOAuthenticator.client_secret = os.environ.get("COGNITO_CLIENT_SECRET", "")
          c.GenericOAuthenticator.authorize_url = f"{cognito_domain}/oauth2/authorize"
          c.GenericOAuthenticator.token_url     = f"{cognito_domain}/oauth2/token"
          c.GenericOAuthenticator.userdata_url  = f"{cognito_domain}/oauth2/userInfo"
          # Cognito returns 'email' as a stable claim.
          c.GenericOAuthenticator.username_claim = "email"
          c.GenericOAuthenticator.allow_all      = True
          c.GenericOAuthenticator.scope          = ["openid", "profile", "email"]
          c.GenericOAuthenticator.login_service  = "Cognito (KB)"
          public_url = os.environ.get("JUPYTERHUB_PUBLIC_URL", "").rstrip("/")
          if public_url:
              c.GenericOAuthenticator.oauth_callback_url = f"{public_url}/hub/oauth_callback"
              # On JupyterHub logout, also clear the Cognito session so the next
              # "Sign in" actually presents the login form. Without this, Cognito's
              # SSO cookie auto-signs the same user back in.
              c.GenericOAuthenticator.logout_redirect_url = (
                  f"{cognito_domain}/logout"
                  f"?client_id={cognito_client_id}"
                  f"&logout_uri={public_url}/hub/login"
              )
      else:
          # ── NativeAuthenticator fallback (Cognito 미설정 시) ──────────
          import nativeauthenticator
          c.JupyterHub.authenticator_class = "nativeauthenticator.NativeAuthenticator"
          c.NativeAuthenticator.open_signup = True
          c.Authenticator.allow_all = True

    02-litellm-keys: |
      # pre_spawn_hook: creates a per-user LiteLLM virtual key on first spawn
      # and injects it as ANTHROPIC_API_KEY so each user is isolated in Bedrock billing.
      # The key is persisted in a K8s Secret (litellm-vkey-<username>) for reuse.
      #
      # Per-user limits applied at key creation. Override per-user via
      # Admin UI or `/key/update` API — these are only defaults for *new* keys.
      # Opus 4.8 같은 대용량 모델 사용 고려해서 한도 상향.
      # Opus 4.8 입력 가격이 sonnet 대비 ~5배 비싸지만 context window가 200k+
      # 라 long-context 작업 시 1회 호출이 수만~수십만 토큰 소비할 수 있음.
      DEFAULT_USER_LIMITS = {
          "max_budget": 30.0,             # USD per budget_duration window (20 → 30)
          "budget_duration": "30d",       # rolling 30-day window
          "rpm_limit": 60,                # max requests per minute (30 → 60, Opus 호출 시간 길어 여유)
          "tpm_limit": 500000,            # max tokens per minute (50k → 500k, Opus context 폭증 대비)
          "max_parallel_requests": 5,     # 동시 호출 5개 허용 (병렬 작업/스트림)
          # Must match model_name entries registered in k8s/litellm.yaml.
          "models": [
              "claude-sonnet-4-6",
              "claude-opus-4-7",
              "claude-opus-4-8",
              "claude-haiku-4-5-20251001",
          ],
      }

      import base64, os, re
      import requests as _requests

      def _vkey_secret_name(username):
          name = re.sub(r'[^a-z0-9-]', '-', username.lower())
          name = re.sub(r'-+', '-', name).strip('-')
          return ('litellm-vkey-' + name)[:253]

      async def pre_spawn_hook(spawner):
          from kubernetes_asyncio import client as k8s_client, config as k8s_config
          from kubernetes_asyncio.client.rest import ApiException

          username    = spawner.user.name
          namespace   = os.environ.get("POD_NAMESPACE", "jupyterhub")
          secret_name = _vkey_secret_name(username)
          litellm_url = "http://litellm:4000"
          master_key  = os.environ.get("LITELLM_MASTER_KEY", "")

          virtual_key = None
          try:
              try:
                  k8s_config.load_incluster_config()
              except Exception:
                  k8s_config.load_kube_config()

              async with k8s_client.ApiClient() as api:
                  v1 = k8s_client.CoreV1Api(api)

                  # Try to read existing virtual key secret
                  try:
                      secret = await v1.read_namespaced_secret(secret_name, namespace)
                      virtual_key = base64.b64decode(secret.data["api-key"]).decode()
                      spawner.log.info(f"LiteLLM: reusing existing key for {username}")
                      # Reconcile model list so keys auto-pick-up newly-allowed models.
                      try:
                          _requests.post(
                              f"{litellm_url}/key/update",
                              json={"key": virtual_key, "models": DEFAULT_USER_LIMITS["models"]},
                              headers={"Authorization": f"Bearer {master_key}"},
                              timeout=10,
                          )
                      except Exception as _re:
                          spawner.log.warning(f"LiteLLM: model reconcile failed for {username}: {_re}")
                  except ApiException as e:
                      if e.status != 404:
                          raise

                      # Generate a new virtual key via LiteLLM API with per-user limits
                      resp = _requests.post(
                          f"{litellm_url}/key/generate",
                          json={
                              "user_id": username,
                              "key_alias": f"jh-{username[:50]}",
                              **DEFAULT_USER_LIMITS,
                          },
                          headers={"Authorization": f"Bearer {master_key}"},
                          timeout=10,
                      )
                      resp.raise_for_status()
                      virtual_key = resp.json()["key"]

                      # Persist in K8s Secret for future spawns
                      try:
                          await v1.create_namespaced_secret(
                              namespace,
                              k8s_client.V1Secret(
                                  metadata=k8s_client.V1ObjectMeta(
                                      name=secret_name,
                                      namespace=namespace,
                                  ),
                                  data={"api-key": base64.b64encode(virtual_key.encode()).decode()},
                              ),
                          )
                          spawner.log.info(f"LiteLLM: created virtual key for {username}")
                      except ApiException as ex:
                          if ex.status == 409:  # race: another spawn created it first
                              s = await v1.read_namespaced_secret(secret_name, namespace)
                              virtual_key = base64.b64decode(s.data["api-key"]).decode()
                          else:
                              raise

          except Exception as e:
              spawner.log.error(f"LiteLLM key setup failed for {username}: {e}")

          if virtual_key:
              spawner.environment["ANTHROPIC_API_KEY"] = virtual_key
          elif master_key:
              # Fall back to master key so Claude Code still works
              spawner.environment["ANTHROPIC_API_KEY"] = master_key
              spawner.log.warning(f"LiteLLM: falling back to master key for {username}")

      c.Spawner.pre_spawn_hook = pre_spawn_hook

    03-user-overrides: |
      # 사용자별 리소스 override (Cognito email 기준).
      # 02-litellm-keys의 pre_spawn_hook을 chain하여 둘 다 실행.
      USER_MEMORY_OVERRIDES = {
          "sungdong.yeo@kbfg.com": {"mem_limit": "8G", "mem_guarantee": "8G"},
          "2855373@kbfg.com": {"mem_limit": "8G", "mem_guarantee": "8G"},
      }
      _litellm_pre_spawn = c.Spawner.pre_spawn_hook
      async def chained_pre_spawn_hook(spawner):
          # LiteLLM vkey 발급 먼저
          if _litellm_pre_spawn:
              await _litellm_pre_spawn(spawner)
          # 그 다음 메모리 override (정의된 사용자만)
          override = USER_MEMORY_OVERRIDES.get(spawner.user.name)
          if override:
              spawner.mem_limit = override["mem_limit"]
              spawner.mem_guarantee = override["mem_guarantee"]
              spawner.log.info(
                  f"[memory-override] {spawner.user.name}: "
                  f"limit={spawner.mem_limit} guarantee={spawner.mem_guarantee}"
              )
      c.Spawner.pre_spawn_hook = chained_pre_spawn_hook

    99-templates: |
      # Register the directory holding our custom templates (mounted from hub-templates ConfigMap).
      # JupyterHub searches template_paths first, then falls back to the package default.
      c.JupyterHub.template_paths = ["/etc/jupyterhub/custom-templates"]

  extraVolumes:
    - name: hub-templates
      configMap:
        name: hub-templates
        optional: true
  extraVolumeMounts:
    - name: hub-templates
      mountPath: /etc/jupyterhub/custom-templates
      readOnly: true

  db:
    pvc:
      storageClassName: gp2
      accessModes:
        - ReadWriteOnce
      storage: 2Gi

# ============================================================
# Proxy
# ============================================================
# ============================================================
# Cull idle servers — Karpenter consolidation 살리는 핵심
# ============================================================
# 사용자가 "Stop My Server" 안 눌러도 60분 idle 지나면 singleuser pod 자동 종료.
# pod 사라지면 Karpenter가 빈 노드 30초 후 consolidate (NodePool.disruption 설정).
# 결과: 한가한 시간엔 워커 노드 자동 축소 → 비용 절감.
# - timeout: 활동 없으면 종료까지 대기 시간 (초)
# - every:   체크 주기 (초)
# - maxAge:  강제 종료 최대 수명 (0=무제한)
# - users:   user 자체는 안 지움 (다음 로그인 시 재spawn, 홈 PVC 보존)
cull:
  enabled: true
  timeout: 604800       # 임시 7일 (sungdong.yeo 며칠 보호용. 원복 시 10800으로 되돌릴 것)
  every: 600
  maxAge: 0
  users: false

proxy:
  annotations:
    karpenter.sh/do-not-disrupt: "true"
  secretToken: ""
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

# ============================================================
# Single-user server (per-user pod)
# ============================================================
singleuser:
  # Karpenter consolidation 대상에서 제외 — 사용자 작업 도중 노드 이주 금지.
  # 노드 자체가 죽으면 node-out-of-service-tainter CronJob이 force-detach 트리거.
  extraAnnotations:
    karpenter.sh/do-not-disrupt: "true"

  image:
    name: ""          # set by deploy.sh: <ECR>/codeserver-kbdev
    tag: latest
    pullPolicy: Always

  defaultUrl: "/launcher"

  # Ensure code-server User settings.json has Claude Code defaults applied,
  # /usr/local/bin/claude symlink exists, and ~/.claude.json has the env-var key
  # pre-approved (skips the "Detected a custom API key" prompt).
  lifecycleHooks:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            # postStart MUST exit 0 — kubelet kills the pod on hook failure.
            # Wrap each step in `|| true` and `exit 0` at the end as a safety net.

            # ────────────────────────────────────────────────────────────
            # PVC가 /home/jovyan 통째로 마운트하므로 image-baked dotfiles
            # (.bashrc, .conda, .local/share/code-server 등)이 가려짐.
            # /etc/skel-home에서 PVC에 없는 것만 복사 → 사용자 변경 보존 (cp -rn).
            # ────────────────────────────────────────────────────────────
            if [ -d /etc/skel-home ]; then
                sudo cp -rn /etc/skel-home/. /home/jovyan/ 2>/dev/null || true
                sudo chown -R jovyan:users /home/jovyan/.bashrc /home/jovyan/.profile \
                    /home/jovyan/.conda /home/jovyan/.config /home/jovyan/.local \
                    /home/jovyan/.jupyter /home/jovyan/.mamba 2>/dev/null || true
            fi

            # ────────────────────────────────────────────────────────────
            # 마운트 path 변경 마이그레이션 (idempotent, 1회만 동작):
            # 이전엔 PVC가 /home/jovyan/work에 마운트되어 사용자 파일이
            # PVC 루트(=현재 /home/jovyan/)에 직접 있었음. work/ 서브디렉토리
            # 가 없는데 사용자 파일(.ipynb/.py)이 보이면 work/로 이주.
            # ────────────────────────────────────────────────────────────
            if [ ! -d /home/jovyan/work ] && \
               ls /home/jovyan/*.ipynb /home/jovyan/*.py /home/jovyan/*.md 2>/dev/null | head -1 >/dev/null; then
                mkdir -p /home/jovyan/work
                shopt -s nullglob 2>/dev/null || true
                for f in /home/jovyan/*; do
                    case "$(basename "$f")" in
                        work|.*) continue ;;  # work/, dotfile 제외
                    esac
                    mv "$f" /home/jovyan/work/ 2>/dev/null || true
                done
            fi
            mkdir -p /home/jovyan/work

            mkdir -p /home/jovyan/.local/share/code-server/User || true
            cat > /home/jovyan/.local/share/code-server/User/settings.json <<'EOF' || true
            {
              "extensions.autoCheckUpdates": false,
              "extensions.autoUpdate": false,
              "claudeCode.hideOnboarding": true,
              "claudeCode.preferredLocation": "panel",
              "remote.autoForwardPorts": false
            }
            EOF
            # Expose the extension-bundled claude binary on PATH so "claude" works
            # in the terminal. /usr/local/bin is root-owned, so use sudo (jovyan
            # has NOPASSWD sudo per Dockerfile).
            CLAUDE_BIN=$(ls /opt/code-server-extensions/anthropic.claude-code-*/resources/native-binaries/linux-x64/claude 2>/dev/null | head -1)
            if [ -n "$CLAUDE_BIN" ]; then
                sudo ln -sf "$CLAUDE_BIN" /usr/local/bin/claude || true
            fi
            # Pre-seed Claude Code config so the user never sees the
            # "Detected a custom API key" approval prompt or onboarding flow.
            # Pre-approve the env-var key by storing its last-20-char suffix in
            # customApiKeyResponses.approved (claude binary: sI(H){return H.slice(-20)}).
            # NOTE: do NOT set apiKeyHelper — claude warns about "auth conflict" if
            # both apiKeyHelper and ANTHROPIC_API_KEY are set.
            python3 - <<'PYEOF' || true
            import json, os
            key = os.environ.get("ANTHROPIC_API_KEY", "")
            cfg_path = "/home/jovyan/.claude.json"
            cfg = {}
            try:
                with open(cfg_path) as f:
                    cfg = json.load(f)
            except Exception:
                pass
            cfg["hasCompletedOnboarding"] = True
            ckr = cfg.setdefault("customApiKeyResponses", {"approved": [], "rejected": []})
            ckr.setdefault("approved", [])
            ckr.setdefault("rejected", [])
            if key:
                suffix = key[-20:]
                if suffix not in ckr["approved"]:
                    ckr["approved"].append(suffix)
            with open(cfg_path, "w") as f:
                json.dump(cfg, f, indent=2)
            PYEOF
            exit 0

  # Allow egress from per-user pods to the LiteLLM proxy (Claude Code → Bedrock).
  # Default singleuser netpol blocks all RFC1918 traffic, so the in-cluster
  # ClusterIP for litellm (10.x) needs an explicit rule.
  networkPolicy:
    egress:
      - to:
          - podSelector:
              matchLabels:
                app: litellm
        ports:
          - port: 4000
            protocol: TCP

  storage:
    type: dynamic
    dynamic:
      storageClass: gp2
    capacity: 10Gi
    homeMountPath: /home/jovyan
    # launcher-ext ConfigMap을 마운트해서 이미지의 baked launcher_ext.py를 override.
    # → launcher 변경 시 이미지 재빌드 없이 ConfigMap만 갱신 + pod 재기동으로 반영.
    extraVolumes:
      - name: launcher-ext
        configMap:
          name: launcher-ext
      # GPU EC2용 shared SSH private key (gpu-ec2/install.sh가 Secret 생성).
      # 사용자는 `ssh -i ~/.ssh/gpu_key ubuntu@$GPU_HOST`로 접속.
      - name: gpu-ssh
        secret:
          secretName: gpu-ssh-key
          defaultMode: 0600
          optional: true                   # Secret 없으면 spawn 실패 방지
    extraVolumeMounts:
      - name: launcher-ext
        mountPath: /opt/jupyter-custom-launcher/launcher_ext.py
        subPath: launcher_ext.py
        readOnly: true
      - name: launcher-ext
        mountPath: /etc/jupyter/jupyter_server_config.d/launcher_ext.json
        subPath: launcher_ext.json
        readOnly: true
      - name: gpu-ssh
        mountPath: /home/jovyan/.ssh/gpu_key
        subPath: gpu_key
        readOnly: true

  extraEnv:
    CODE_EXTENSIONSDIR: /opt/code-server-extensions
    GRANT_SUDO: "yes"
    RESTARTABLE: "yes"
    # ANTHROPIC_API_KEY is injected per-user by pre_spawn_hook (LiteLLM virtual key).
    # pip 기본 동작을 ~/.local 설치로 변경 → PVC에 영구 저장.
    # 안 하면 /opt/conda(이미지 overlay)에 설치되어 pod 재시작 시 사라짐.
    # venv 안에선 PIP_USER 무시되므로 venv 사용 시 부작용 없음.
    PIP_USER: "1"
    # ANTHROPIC_BASE_URL points to LiteLLM proxy → AWS Bedrock via IRSA.
    ANTHROPIC_BASE_URL: "http://litellm:4000"
    # GitLab CloudFront URL — launcher_ext renders the GitLab card pointing here.
    # Set via deploy.sh --set if changed.
    GITLAB_URL: "https://do0wih0smm7a6.cloudfront.net"
    # Jenkins CloudFront URL — launcher_ext renders the Jenkins card pointing here.
    # Set by deploy.sh from .env JENKINS_URL.
    JENKINS_URL: ""
    # Harbor CloudFront URL — launcher_ext renders the Harbor card pointing here.
    # Set by deploy.sh from .env HARBOR_URL.
    HARBOR_URL: ""
    # Nexus CloudFront URL — launcher_ext renders the Nexus card pointing here.
    # Set by deploy.sh from .env NEXUS_URL.
    NEXUS_URL: ""
    # Argo CD CloudFront URL — launcher_ext renders the Argo CD card pointing here.
    # Set by deploy.sh from .env ARGOCD_URL.
    ARGOCD_URL: ""
    # GPU EC2 private IP (gpu-ec2/install.sh 결과). 사용자가 ssh gpu 접속용.
    GPU_HOST: ""
    # Skip Claude Code's /login prompt — users only use the env-var API key.
    CLAUDE_CODE_SKIP_AUTH_LOGIN: "1"
    # Bedrock's `thinking` schema only accepts type='enabled'|'disabled'; Claude
    # Code defaults to type='adaptive' which 400s. Disable both adaptive and
    # plain thinking so claude never sends the field. LiteLLM's
    # additional_drop_params is a safety net in case Claude Code ignores these.
    CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING: "1"
    CLAUDE_CODE_DISABLE_THINKING: "1"

  uid: 1000
  fsGid: 100

  cpu:
    limit: 2
    guarantee: 0.1
  memory:
    # guarantee == limit: 스케줄러가 물리 메모리를 초과 배치(overcommit)하지 못하게 해
    # 노드 OOM → kubelet 사망(NodeNotReady)을 구조적으로 차단한다.
    limit: 4G
    guarantee: 4G

  # 사용자 세션이 Spot 회수(interruption)로 강제 재시작되지 않도록 on-demand 노드에만 배치.
  # (Karpenter가 노드에 karpenter.sh/capacity-type 라벨 부여. bootstrap managed-ng 노드엔
  #  이 라벨이 없어 자동 제외됨.) hub/proxy/litellm 등 나머지는 계속 spot 사용 → 비용 절감 유지.
  nodeSelector:
    karpenter.sh/capacity-type: on-demand

  profileList:
    - display_name: "개발환경 #1"
      description: "KB표준개발환경에서 기본 제공하는 개발환경입니다."
      default: true

# ============================================================
# Ingress (AWS ALB Ingress Controller)
# Enable after installing aws-load-balancer-controller on the cluster.
# ============================================================
ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
  hosts:
    - ""
  tls: []

# ============================================================
# Scheduling / resource management
# ============================================================
scheduling:
  userScheduler:
    enabled: false
  podPriority:
    enabled: false
  userPlaceholder:
    enabled: false

# ============================================================
# Pre-puller — disabled to keep node startup fast.
# ============================================================
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
