# JupyterHub docker compose configuration file

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile.jupyterhub
      args:
        # 폐쇄망: 내부 PyPI 미러 주소로 설정
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: always
    image: jupyterhub:local
    container_name: jupyterhub
    networks:
      - jupyterhub-network
    volumes:
      # JupyterHub 설정 파일
      - "./jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro"
      # Docker 소켓 (컨테이너에서 Docker daemon 접근)
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # JupyterHub 데이터 (DB, cookie secrets)
      - "jupyterhub-data:/data"
    ports:
      - "${JUPYTERHUB_PORT:-8000}:8000"
    environment:
      # JupyterHub 관리자 사용자명
      JUPYTERHUB_ADMIN: ${JUPYTERHUB_ADMIN:-admin}
      # Docker 네트워크 이름
      DOCKER_NETWORK_NAME: jupyterhub-network
      # 사용자 노트북 이미지
      DOCKER_NOTEBOOK_IMAGE: ${DOCKER_NOTEBOOK_IMAGE:-codeserver-kbdev:local}
      # 노트북 디렉토리
      DOCKER_NOTEBOOK_DIR: /home/jovyan/work

volumes:
  jupyterhub-data:

networks:
  jupyterhub-network:
    name: jupyterhub-network
    # 기존 네트워크가 있으면 재사용, 없으면 생성
    external: false
